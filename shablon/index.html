аложены деньги на индексацию социальных выплат: выплаты ветеранам, инвалидам и материнский капитал индексируются на уровень инфляции. Страховые пенсии в 2027 году индексируются дважды: с 1 февраля на 6,8% и с 1 апреля еще на 3,3%."],who:"Всех граждан: пенсионеров, семьи с детьми, ветеранов, людей с инвалидностью, участников СВО и их семьи, а также регионы, которые получают деньги из федерального бюджета.",nx:["Законопроект переходит ко второму чтению."]},{id:"136263",d:"29.10.2026",b:"621-9",doc:"621-9",q:"Бюджет ФОМС",t:"О бюджете Федерального фонда обязательного медицинского страхования на 2027 год и на плановый период 2028 и 2029 годов",rd:"1-е",ok:!0,tot:[386,0,37,27],fr:[[329,0,0,21,350],[0,0,37,0,37],[21,0,0,3,24],[19,0,0,0,19],[15,0,0,2,17],[2,0,0,0,2]],tm:"16:38:36",sut:["Бюджет фонда ОМС на 2027–2029 годы. Доходы фонда в 2027 году впервые превысят 5 трлн рублей.","На бесплатную медицинскую помощь, включая часть высокотехнологичных операций, профилактику, диспансеризацию и оплату труда врачей, — более 16 трлн рублей за три года."],who:"Всех, кто лечится по полису ОМС, а также врачей и медицинский персонал.",nx:["Законопроект переходит ко второму чтению."]},{id:"136264",d:"29.10.2026",b:"620-9",doc:"620-9",q:"Бюджет Соцфонда",t:"О бюджете Фонда пенсионного и социального страхования Российской Федерации на 2027 год и на плановый период 2028 и 2029 годов",rd:"1-е",ok:!0,tot:[370,0,52,28],fr:[[329,0,0,21,350],[0,0,37,0,37],[21,0,0,3,24],[19,0,0,0,19],[0,0,15,2,17],[1,0,0,1,2]],tm:"17:36:48",sut:["Бюджет Социального фонда на 2027–2029 годы: свыше 63 трлн рублей за три года.","Деньги пойдут на пенсии с учетом индексации, поддержку семей с детьми, инвалидов, участников СВО и их семей. Страховые пенсии в 2027 году индексируются с 1 февраля на 6,8% и с 1 апреля на 3,3%; средняя пенсия на конец 2027 года — 29 904 рубля."],who:"Пенсионеров, семьи с детьми, людей с инвалидностью, участников СВО и их семьи.",nx:["Законопроект переходит ко второму чтению."]},{id:"136265",d:"29.10.2026",b:"616-9",doc:"616-9",q:"Поправки в Бюджетный кодекс",t:`О внесении изменений в Бюджетный кодекс Российской Федерации 
и отдельные законодательные акты Российской Федерации (о совершенствовании бюджетного законодательства)`,rd:"1-е",ok:!0,tot:[378,0,45,27],fr:[[329,0,0,21,350],[0,0,37,0,37],[22,0,0,2,24],[19,0,0,0,19],[6,0,8,3,17],[2,0,0,0,2]],tm:"18:32:19",sut:["Базовая цена нефти в бюджетном правиле на 2027–2030 годы снижается до 50 долларов за баррель. Доходы от нефти сверх этой цены идут в резерв — Фонд национального благосостояния.","При угрозах безопасности по решению президента бюджеты всех уровней можно будет принимать на один год, а не на три.","Часть НДФЛ и весь единый сельхозналог, которые сейчас получают муниципалитеты, переходят в бюджеты регионов."],who:"Регионы и муниципалитеты, их бюджеты и дорожные фонды, а также получателей бюджетных средств.",nx:["Законопроект переходит ко второму чтению."]},{id:"136266",d:"29.10.2026",b:"619-9",doc:"619-9",q:"Исполнение бюджетов в 2027",t:`Об установлении особенностей исполнения бюджетов бюджетной системы Российской Федерации в 2027 году, о внесении изменений в отдельные законодательные акты Российской Федерации, приостановлении действия отдельных положений законодательных актов Российской Федерации 
и признании утратившими силу отдельных положений законодательных актов Российской Федерации`,rd:"1-е",ok:!0,tot:[371,0,51,28],fr:[[329,0,0,21,350],[0,0,37,0,37],[22,0,0,2,24],[18,0,0,1,19],[0,0,14,3,17],[2,0,0,0,2]],tm:"18:33:32",sut:["Особые правила исполнения бюджетов в 2027 году. Расходы федерального бюджета можно превысить сверх бюджетного правила на 1,5 трлн рублей в 2027 году и на 500 млрд в 2028 году.","МРОТ с 1 января 2027 года — 28 935 рублей в месяц. Привязка МРОТ к медианной зарплате приостанавливается на 2027–2029 годы.","При назначении единого пособия на детей начнут учитывать деньги, поступившие на счета и вклады семьи в банках. Для товаров интернет-торговли из-за рубежа вводятся отдельные таможенные правила."],who:"Работников с зарплатой на уровне МРОТ, семьи, которые получают единое пособие, покупателей зарубежных интернет-магазинов, регионы и муниципалитеты.",nx:["Законопроект переходит ко второму чтению."]},{id:"136267",d:"29.10.2026",b:"617-9",doc:"617-9",q:"Налоговые поправки",t:"О внесении изменений в части первую и вторую Налогового кодекса Российской Федерации и отдельные законодательные акты Российской Федерации (в части реализации отдельных положений основных направлений налоговой политики)",rd:"1-е",ok:!0,tot:[387,0,37,26],fr:[[329,0,0,21,350],[0,0,37,0,37],[22,0,0,2,24],[19,0,0,0,19],[15,0,0,2,17],[2,0,0,0,2]],tm:"19:34:32",sut:["Большой пакет поправок в Налоговый кодекс к бюджету на 2027–2029 годы: НДФЛ, НДС, акцизы, налог на прибыль, налоговое администрирование.","Прогрессивная шкала НДФЛ от 13 до 22% распространяется на большинство доходов, включая проценты по вкладам, дивиденды и выплаты по страхованию. Акцизы на алкоголь, табак, никотин и топливо индексируются, жидкости для электронных сигарет без никотина становятся подакцизными.","Маркетплейсы получают функции по налоговому контролю продавцов. Штрафы индексируются на накопленную инфляцию."],who:"Всех плательщиков НДФЛ, особенно тех, кто получает проценты по вкладам и дивиденды; покупателей алкоголя, табака, топлива и вейпов; продавцов на маркетплейсах, бизнес, ИТ-компании.",nx:["Законопроект переходит ко второму чтению."]},{id:"136268",d:"29.10.2026",b:"618-9",doc:"618-9",q:"Налог на сверхдоходы",t:"О налоге на сверхдоходы",rd:"1-е",ok:!0,tot:[423,0,0,27],fr:[[328,0,0,22,350],[37,0,0,0,37],[22,0,0,2,24],[19,0,0,0,19],[15,0,0,2,17],[2,0,0,0,2]],tm:"19:35:21",sut:["Новый налог для компаний, которые добывают полезные ископаемые, в том числе золото. Им облагается сверхдоход — прирост стоимости добытого из-за того, что средняя мировая цена в рублях выросла по сравнению с 2025 годом.","Налог платится, если цена выросла не менее чем на 10%. Ставка — 30%, для золота — 20%."],who:"Горнодобывающие компании, включая золотодобытчиков. Граждан напрямую не касается.",nx:["Законопроект переходит ко второму чтению."]},{id:"136269",d:"29.10.2026",b:"21118-9",doc:"Пост. 21118-9",q:"Составы комитетов",t:"Об изменениях в составах некоторых комитетов Государственной Думы и о внесении изменений в пост…",rd:"—",ok:!0,tot:[423,0,0,27],fr:[[329,0,0,21,350],[37,0,0,0,37],[22,0,0,2,24],[19,0,0,0,19],[14,0,0,3,17],[2,0,0,0,2]],tm:"19:37:20",sut:["Депутаты обновили составы нескольких комитетов Госдумы (о депутатах Ш. В. Кара-ооле и А. С. Фадзаеве)."],who:"Депутатов Государственной Думы.",nx:["Постановление Государственной Думы вступает в силу со дня принятия."]},{id:"136270",d:"29.10.2026",b:"21121-9",doc:"Пост. 21121-9",q:"Зампред комитета (способ)",t:"О заместителе председателя Комитета Государственной Думы по международным делам (о депутате Гос…",rd:"выбор способа голосования",ok:!0,tot:[421,0,0,29],fr:[[328,0,0,22,350],[37,0,0,0,37],[20,0,0,4,24],[19,0,0,0,19],[15,0,0,2,17],[2,0,0,0,2]],tm:"19:39:30",sut:["Депутаты выбрали, как голосовать по кандидатуре заместителя председателя Комитета по международным делам."],who:"Депутатов Государственной Думы.",nx:[]},{id:"136271",d:"29.10.2026",b:"21121-9",doc:"Пост. 21121-9",q:"Зампред комитета по междел",t:"О заместителе предс с Зимбабве",t:"О ратификации Договора между Российской Федерацией и Республикой Зимбабве о взаимной правовой помощи по уголовным делам",rd:"—",ok:!0,tot:[421,0,0,29],fr:[[330,0,0,20,350],[35,0,0,2,37],[21,0,0,3,24],[19,0,0,0,19],[14,0,0,3,17],[2,0,0,0,2]],tm:"12:24:56",sut:["Россия и Зимбабве будут помогать друг другу в уголовных делах, если деяние считается преступлением в обеих странах. Если по законам запрашиваемой стороны деяние не преступление, помощь можно оказать по ее усмотрению."],who:"Правоохранительные органы и суды России и Зимбабве, участников уголовных дел.",nx:["Закон направляется в Совет Федерации."]},{id:"136244",d:"28.10.2026",b:"17978-9",doc:"17978-9",q:"Защита граждан с Камбоджей",t:"О ратификации Соглашения между Российской Федерацией и Королевством Камбоджа о взаимной защите граждан в области международной уголовной юстиции",rd:"—",ok:!0,tot:[421,0,0,29],fr:[[329,0,0,21,350],[36,0,0,1,37],[21,0,0,3,24],[19,0,0,0,19],[14,0,0,3,17],[2,0,0,0,2]],tm:"12:29:10",sut:["Россия и Камбоджа договорились защищать своих граждан: каждая сторона не допускает на своей территории попыток незаконно ограничить свободу защищенных лиц другой стороны по требованию третьих стран или лиц."],who:"Граждан России и Камбоджи.",nx:["Закон направляется в Совет Федерации."]},{id:"136245",d:"28.10.2026",b:"17972-9",doc:"17972-9",q:"Выдача с Никарагуа",t:"О ратификации Договора между Российской Федерацией и Республикой Никарагуа о выдаче",rd:"—",ok:!0,tot:[417,0,0,33],fr:[[329,0,0,21,350],[34,0,0,3,37],[21,0,0,3,24],[19,0,0,0,19],[12,0,0,5,17],[2,0,0,0,2]],tm:"12:33:05",sut:["Россия и Никарагуа будут выдавать друг другу людей для уголовного преследования или исполнения приговора. В выдаче можно отказать, если она навредит суверенитету, безопасности или другим важным интересам страны."],who:"Лиц, которых разыскивают по уголовным делам в России и Никарагуа.",nx:["Закон направляется в Совет Федерации."]},{id:"136246",d:"28.10.2026",b:"17983-9",doc:"17983-9",q:"Передача осужденных с Никарагуа",t:"О ратификации Договора между Российской Федерацией и Республикой Никарагуа о передаче для отбывания наказания лиц, осужденных к лишению свободы",rd:"—",ok:!0,tot:[419,0,0,31],fr:[[329,0,0,21,350],[35,0,0,2,37],[21,0,0,3,24],[19,0,0,0,19],[13,0,0,4,17],[2,0,0,0,2]],tm:"12:38:38",sut:["Человека, осужденного к лишению свободы в одной из стран, можно будет передать в другую страну, чтобы он отбывал наказание там."],who:"Осужденных граждан России и Никарагуа.",nx:["Закон направляется в Совет Федерации."]},{id:"136247",d:"28.10.2026",b:"8112-9",doc:"8112-9",q:"Косвенные налоги с Беларусью",t:"О ратификации Протокола о внесении изменений в Договор между Российской Федерацией и Республикой Беларусь об общих принципах налогообложения по косвенным налогам от 3 октября 2022 года",rd:"—",ok:!0,tot:[419,0,0,31],fr:[[328,0,0,22,350],[36,0,0,1,37],[21,0,0,3,24],[19,0,0,0,19],[13,0,0,4,17],[2,0,0,0,2]],tm:"12:43:26",sut:["Россия ратифицирует протокол об изменениях в договор с Беларусью об общих принципах взимания косвенных налогов от 3 октября 2022 года."],who:"Компании, торгующие между Россией и Беларусью.",nx:["Закон направляется в Совет Федерации."]},{id:"136248",d:"28.10.2026",b:"1327147-8",doc:"1327147-8",q:"Выслуга в таможне с Южной Осетией",t:"О ратификации Соглашения между Российской Федерацией и Республикой Южная Осетия о взаимном зачете в выслугу лет службы в таможенных органах Российской Федерации и Республики Южная Осетия",rd:"—",ok:!0,tot:[418,0,0,32],fr:[[329,0,0,21,350],[33,0,0,4,37],[21,0,0,3,24],[19,0,0,0,19],[14,0,0,3,17],[2,0,0,0,2]],tm:"12:47:01",sut:["Россия ратифицирует соглашение с Южной Осетией о взаимном зачете в выслугу лет службы в таможенных органах двух стран."],who:"Таможенников России и Южной Осетии.",nx:["Закон направляется в Совет Федерации."]},{id:"136249",d:"28.10.2026",b:"1327029-8",doc:"1327029-8",q:"Согласие на сделки военных",t:"О внесении изменений в статью 35 Семейного кодекса Российской Федерации (в части приравнивания удостоверенного командиром воинской части, соединения или военно-учебного заведения, находящихся в труднодоступной или отдаленной местности, где отсутствует нотариус, согласия на заключение сделки по распоряжению имуществом военнослужащего или его супруги (супруга) к нотариально удостоверенному согласию)",rd:"1-е",ok:!0,tot:[420,0,0,30],fr:[[329,0,0,21,350],[36,0,0,1,37],[21,0,0,3,24],[19,0,0,0,19],[13,0,0,4,17],[2,0,0,0,2]],tm:"13:09:20",sut:["В отдаленных гарнизонах, где нет нотариуса, согласие супруга на сделку с имуществом военнослужащего сможет заверить командир воинской части. Такое согласие будет приравнено к нотариальному.","Законопроект выполняет постановление Конституционного Суда от 30 октября 2025 года. Проблема особенно касается сделок по военной ипотеке (накопительно-ипотечная система)."],who:"Военнослужащие и их супруги, которые живут в труднодоступных и отдаленных гарнизонах.",nx:["Законопроект переходит ко второму чтению."]},{id:"136250",d:"28.10.2026",b:"1342004-8",doc:"1342004-8",q:"Ученический договор в Следственном комитете",t:'О внесении изменений в статью 16 Федерального закона "О Следственном комитете Российской Федерации" (в части уточнения круга лиц, которые в случае неисполнения обязательств по ученическому договору обязаны возместить затраты, понесенные Следственным комитетом Российской Федерации на их обучение)',rd:"1-е",ok:!0,tot:[421,0,0,29],fr:[[329,0,0,21,350],[36,0,0,1,37],[21,0,0,3,24],[19,0,0,0,19],[14,0,0,3,17],[2,0,0,0,2]],tm:"13:26:50",sut:["Уточняется, кто должен вернуть Следственному комитету деньги за обучение при нарушении ученического договора, например при отчислении из вуза комитета не по уважительной причине. Порядок и размер возмещения определит председатель комитета."],who:"Студентов вузов Следственного комитета.",nx:["Законопроект переходит ко второму чтению."]},{id:"136251",d:"28.10.2026",b:"1297721-8",doc:"1297721-8",q:"Возврат товаров с маркетплейсов",t:'О внесении изменений в статью 26(1) Закона Российской Федерации "О защите прав потребителей" и статью 11(1) Федерального закона "Об основах государственного регулирования торговой деятельности в Российской Федерации" (в части правового регулирования отношений, связанных с возвратом потребителем товара надлежащего качества, приобретенного дистанционным способом)',rd:"1-е",ok:!0,tot:[422,0,1,27],fr:[[330,0,0,20,350],[37,0,0,0,37],[21,0,0,3,24],[19,0,0,0,19],[13,0,1,3,17],[2,0,0,0,2]],tm:"13:51:05",sut:["Покупатель сможет вернуть товар надлежащего качества, купленный дистанционно (например, на маркетплейсе), любым удобным способом — за свой счет, но так, чтобы продавец мог проверить состояние товара при получении.","Продавцов обяжут сообщать покупателю о праве на возврат, о способах возврата и о расходах на доставку товара обратно. Законопроект выполняет постановление Конституционного Суда от 17.02.2026 № 7-П."],who:"Покупатели интернет-магазинов и маркетплейсов, а также продавцы, которые торгуют дистанционно.",nx:["Законопроект переходит ко второму чтению."]},{id:"136252",d:"28.10.2026",b:"1306034-8",doc:"1306034-8",q:"Ответственность туроператоров",t:'О внесении изменений в Федеральный закон "Об основах туристской деятельности в Российской Федерации" (в части разграничения ответственности туроператоров, турагентов и третьих лиц, предоставляющих отдельные услуги в рамках реализации туристского продукта)',rd:"1-е",ok:!0,tot:[422,0,0,28],fr:[[330,0,0,20,350],[36,0,0,1,37],[21,0,0,3,24],[19,0,0,0,19],[14,0,0,3,17],[2,0,0,0,2]],tm:"14:17:15",sut:["Каждый участник туррынка будет отвечать за свой этап: туроператор — за сам тур и его качество, турагент — за правильное оформление, информирование клиента и своевременный перевод денег.","Туристы смогут обращаться с претензиями напрямую к турагенту по вопросам, за которые он отвечает. Изменения планируется ввести с 1 марта 2027 года."],who:"Туристы, туроператоры и турагенты.",nx:["Законопроект переходит ко второму чтению."]},{id:"136253",d:"28.10.2026",b:"1327132-8",doc:"1327132-8",q:"Цифровое согласие на медицинское вмешательство",t:'О внесении изменений в Федеральный закон "Об обращении лекарственных средств" и статьи 20 и 100 Федерального закона "Об основах охраны здоровья граждан в Российской Федерации" (в части расширения применения цифровых технологий при подписании информированного добровольного согласия на медицинское вмешательство)',rd:"1-е",ok:!0,tot:[416,0,0,34],fr:[[327,0,0,23,350],[36,0,0,1,37],[21,0,0,3,24],[16,0,0,3,19],[14,0,0,3,17],[2,0,0,0,2]],tm:"14:23:54",sut:["Согласие на медицинское вмешательство или отказ от него можно будет подписать еще одним видом электронной подписи — усиленной неквалифицированной, созданной с помощью средств, сертифицированных Федеральной службой безопасности."],who:"Пациентов и медицинские организации.",nx:["Законопроект переходит ко второму чтению."]},{id:"136254",d:"28.10.2026",b:"1336427-8",doc:"1336427-8",q:"Оборонные инвестпроекты",t:'О внесении изменений в Федеральный закон "О промышленной политике в Российской Федерации" (об оценке технологической целесообразности и реализуемости инвестиционных проектов организаций оборонно-промышленного комплекса)',rd:"1-е",ok:!0,tot:[422,0,0,28],fr:[[331,0,0,19,350],[35,0,0,2,37],[21,0,0,3,24],[19,0,0,0,19],[14,0,0,3,17],[2,0,0,0,2]],tm:"14:53:21",sut:["Оценка технологической целесообразности и реализуемости инвестиционных проектов организаций оборонно-промышленного комплекса."],who:"Организации оборонно-промышленного комплекса и их инвестиционные проекты.",nx:["Законопроект переходит ко второму чтению."]},{id:"136255",d:"28.10.2026",b:"1336436-8",doc:"1336436-8",q:"Кадастровый учет зданий",t:'О внесении изменений в Федеральный закон "О государственной регистрации недвижимости" (в части упрощения осуществления государственного кадастрового учета и изменения сведений ЕГРН в отношении зданий, сооружений в связи с изменением площади таких объектов недвижимости)',rd:"1-е",ok:!0,tot:[418,0,0,32],fr:[[330,0,0,20,350],[32,0,0,5,37],[21,0,0,3,24],[19,0,0,0,19],[14,0,0,3,17 жения Правительства Российской Федерации по данному вопросу."],who:null,nb:null,dl:[["Заседание Правительства","03.11.2026"]],src:[["http://government.ru/meetings/60350/","Материалы заседания на government.ru"]]},{id:"gov37-3",d:"03.11.2026",o:"gov",w:"Заседание Правительства № 37 · повестка: 6 вопросов",k:"Вопрос повестки заседания",no:"п. 3",t:"Восстановление дорог в Дагестане и Чечне после паводков 2026 года",st:"принят",sut:["О выделении Росавтодору в 2026 году из резервного фонда Правительства Российской Федерации бюджетных ассигнований на предоставление иных межбюджетных трансфертов из федерального бюджета бюджетам Республики Дагестан и Чеченской Республики на реализацию мероприятий по восстановлению автомобильных дорог регионального или межмуниципального и местного значения, поврежденных в результате паводков, произошедших в 2026 году","Решение: Принять проект распоряжения Правительства Российской Федерации по данному вопросу."],who:null,nb:null,dl:[["Заседание Правительства","03.11.2026"]],src:[["http://government.ru/meetings/60350/","Материалы заседания на government.ru"]]},{id:"gov37-4",d:"03.11.2026",o:"gov",w:"Заседание Правительства № 37 · повестка: 6 вопросов",k:"Вопрос повестки заседания",no:"п. 4",t:"Поправки Правительства к законопроекту № 1209623-8 об охране здоровья",st:"одобрено",sut:["О проекте поправок Правительства Российской Федерации к проекту федерального закона №1209623-8 «О внесении изменений в Федеральный закон “Об основах охраны здоровья граждан в Российской Федерации”»","Решение: Одобрить проект поправок и направить их в Государственную Думу в установленном порядке."],who:null,nb:null,dl:[["Заседание Правительства","03.11.2026"]],src:[["http://government.ru/meetings/60350/","Материалы заседания на government.ru"]]},{id:"gov37-5",d:"03.11.2026",o:"gov",w:"Заседание Правительства № 37 · повестка: 6 вопросов",k:"Вопрос повестки заседания",no:"п. 5",t:"Отмена актов в части Положения о Минтруде",st:"принят",sut:["О признании утратившими сил стем.",nb:null,dl:[["Сообщено на government.ru","03.11.2026"]],src:[["http://government.ru/news/60357/","government.ru/news/60357"]]},{id:"gov-3166",d:"03.11.2026",o:"gov",w:"Решения и распоряжения",k:"Распоряжение Правительства",no:"№ 3166-р",t:"Около 600 млн руб. на завершение рыбного порта в Корсакове",st:"подписано",sut:["Около 600 млн руб. на завершение строительства рыбного порта в морском порту Корсаков (Сахалинская область); порт войдет в Трансарктический транспортный коридор."],who:null,nb:null,dl:[["Подписано","31.10.2026"]],src:[["http://government.ru/docs/60356/","government.ru/docs/60356"]]},{id:"calp0",d:"11.11.2026",o:"gd",w:"Пленарное заседание (план)",k:"Правительственный час",t:"«Правительственный час»: «Инфраструктура для жизни: основные социально-экономические факторы развития»",st:"запланировано",nb:"Источник: pnp.ru 20.10.2026: «правительственный час» перенесён на 11 ноября",src:[["https://www.pnp.ru/state-duma/gosduma-izmenila-grafik-pravitelstvennykh-chasov-na-tekushhuyu-sessiyu.html","pnp.ru"]]}],PL:[{id:"gd-1327114-8",d:"10.11.2026",b:"1327114-8",q:"Архивное дело",t:'О внесении изменений в Федеральный закон "Об архивном деле в Российской Федерации" (в части уточнения отдельных положений Федерального закона)',rd:"1-е чтение",sut:["Законопроект уточняет отдельные положения Федерального закона «Об архивном деле в Российской Федерации». Он подготовлен в связи с вступлением в силу с 1 января 2028 года Федерального закона от 20 марта 2025 года № 33-ФЗ «Об общих принципах организации местного самоуправления в единой системе публичной власти».","В пояснительной записке отдельно описаны особенности архивного дела в городах федерального значения Москве, Санкт-Петербурге и Севастополе, где самостоятельные муниципальные архивы не созданы, а документы Архивного фонда поступают в государственные архивы этих субъектов."],who:"Муниципальные архивы и органы местного самоуправления, в том числе во внутригородских муниципальных образованиях Москвы, Санкт-Петербурга и Севастополя.",src:[["https://sozd.duma.gov.ru/bill/1327114-8","sozd.duma.gov.ru"]]},{id:"gd-1249111-8",d:"10.11.2026",b:"1249111-8",q:"Ответственность почты за платежки",t:"О внесении изменений в Кодекс Российской Федерации об административных правонарушениях (об установлении ответственности за нарушение организацией федеральной почтовой связи порядка направления платежных документов и информации о размере платы)",rd:"1-е чтение",sut:["Законопроектом предлагается внести изменения в Кодекс Российской Федерации об административных правонарушениях, в том числе дополнить главу 13 статьей 13.19.7. Эта статья вводит административную ответственность за нарушение организациями федеральной почтовой связи порядка направления платежных документов и информации о размере платы, предусмотренных жилищным законодательством.","Особый порядок вступления в силу нужен, чтобы дать переходный период на обеспечение работы информационной системы организации федеральной почтовой связи по направлению таких документов."],who:"Организации федеральной почтовой связи, в том числе АО «Почта России». Собственники жилых помещений, которым направляют платежные документы и сведения о размере платы.",src:[["https://sozd.duma.gov.ru/bill/1249111-8","sozd.duma.gov.ru"]]},{id:"gd-1240307-8",d:"10.11.2026",b:"1240307-8",q:"Права на секреты производства",t:"О внесении изменений в статью 1471 части четвертой Гражданского кодекса Российской Федерации (о правах на секреты производства, полученные при выполнении договоров)",rd:"1-е чтение",sut:["Законопроект меняет статью 1471 Гражданского кодекса Российской Федерации: стороны договора подряда или договора на выполнение научно-исследовательских, опытно-конструкторских и технологических работ (далее - договор НИОКТР), если это не государственный или муниципальный контракт, смогут сами определить в договоре, кому принадлежит исключительное право на секрет производства (ноу-хау), полученный при выполнении работ.","Сейчас такое право по общему правилу всегда у подрядчика (исполнителя). Для изобретений, промышленных образцов, полезных моделей и топологий интегральных микросхем такой выбор в договоре уже предусмотрен. Для контрактов на государственные или муниципальные нужды действующий порядок сохраняется."],who:"Заказчики и подрядчики (исполнители) по договорам подряда и договорам НИОКТР между частными лицами. На распределение прав по государственным и муниципальным контрактам это не распространяется.",src:[["https://sozd.duma.gov.ru/bill/1240307-8","sozd.duma.gov.ru"]]}],LAWS:[{d:"01.09.2026",law:"Федеральный закон от 25.04.2026 № 108-ФЗ",t:"Бойцов СВО защитят от сокращения",sut:"Участники СВО, вернувшиеся на прежнее место работы, получают преимущественное право остаться на работе при сокращении штата.",who:"Ветераны СВО и их работодатели.",was:"Работников, вернувшихся после мобилизации или контракта, в перечне ст. 179 ТК, кому отдается предпочтение при сокращении, не было.",now:"При равной производительности и квалификации преимущество остаться получают работники, чей трудовой договор возобновлен после военной службы по мобилизации, по контракту или после добровольческого контракта.",src:[["https://www.pnp.ru/social/zakony-vstupayushhie-v-silu-v-sentyabre-chast-1.html","pnp.ru"],["http://kremlin.ru/acts/bank/53183","kremlin.ru"],["https://www.consultant.ru/law/hotdocs/93774.html","consultant.ru"]]},{d:"01.09.2026",law:"Федеральный закон от 09.04.2026 № 90-ФЗ",t:"Доп. выходной и отпуск пострадавшим при ЧС",sut:"Пострадавшие от ЧС могут получить оплачиваемый выходной и до пяти дней отпуска без сохранения зарплаты; заявление можно подать электронно.",who:"Работники, проживающие в зоне ЧС и потерявшие имущество.",was:"Трудовой кодекс не давал работнику, пострадавшему от ЧС, ни отдельного оплачиваемого выходного, ни права на отпуск без содержания по этому поводу.",now:"Работник из зоны ЧС, у которого нарушены условия жизни или утрачено имущество, получает 1 выходной с сохранением среднего заработка и до 5 календарных дней отпуска без сохранения зарплаты. Заявление подается в течение 5 рабочих дней, в том числе электронно.",src:[["https://www.pnp.ru/social/zakony-vstupayushhie-v-silu-v-sentyabre-chast-1.html","pnp.ru"],["http://kremlin.ru/acts/bank/53124","kremlin.ru"]]},{d:"01.09.2026",law:"Федеральный закон от 10.06.2026 № 162-ФЗ",t:"Медосвидетельствование мигрантов — за 30 дней",sut:"Срок обязательного медосвидетельствования для иностранцев, приехавших более чем на три месяца, сокращен с 90 до 30 дней; при опасной инфекции — депортация.",who:"Иностранные граждане и работодатели мигрантов.",was:"Иностранец, приехавший более чем на 90 дней, должен был пройти медосвидетельствование в течение 90 календарных дней со дня въезда.",now:"Срок сокращен до 30 календарных дней со дня въезда.",src:[["http://duma.gov.ru/news/64038/","duma.gov.ru"],["https://base.garant.ru/414368961/","garant.ru"]]},{d:"01.09.2026",law:"Федеральный закон от 29.12.2025 № 551-ФЗ",t:"Запрет продажи вейпов и табака на остановках",sut:"Табачную и никотинсодержащую продукцию нельзя продавать на остановках общественного транспорта.",who:"Продавцы табака и никотиновой продукции.",was:"Ст. 19 закона № 15-ФЗ не включала остановки общественного транспорта в перечень мест, где запрещена продажа.",now:"Нельзя продавать табак, вейпы, кальяны и никотинсодержащую продукцию на остановках городского и пригородного транспорта. Исключение — если точка на остановке единственная такая в населенном пункте.",src:[["http://duma.gov.ru/news/64038/","duma.gov.ru"],["http://kremlin.ru/acts/bank/52851","kremlin.ru"]]},{d:"01.09.2026",law:"Федеральный закон от 02.05.2026 № 125-ФЗ",t:"Передвижные аптечные пункты",sut:"Лекарства разрешено продавать через передвижные аптечные пункты в населенных пунктах без стационарных аптек.",who:"Жители сел и удаленных территорий, аптечные организации.",was:"Передвижных аптечных пунктов закон не предусматривал.",now:"До 1 сентября 2029 года идет эксперимент: в сельских населенных пунктах, где нет ни аптек, ни медорганизаций с лицензией, лекарства могут продавать передвижные аптечные пункты. Порядок — постановление правительства от 24.08.2026 № 1068.",src:[["http://duma.gov.ru/news/64038/","duma.gov.ru"],["http://kremlin.ru/acts/bank/53193","kremlin.ru"]]},{d:"01.09.2026",law:"Федеральный закон от 29.12.2025 № 575-ФЗ",t:"Самозапрет на азартные игры",sut:"Гражданин может оформить самозапрет на участие в азартных играх через МФЦ или Госуслуги; реклама игр будет с предупреждением о зависимости.",who:"Граждане, букмекеры и рекламодатели.",was:"Государственного способа самому запретить себе азартные игры не было.",now:"Через Госуслуги или в любом МФЦ можно включить себя в единый перечень отказавшихся от азартных игр минимум на 12 месяцев; отозвать запрет досрочно нельзя. В перечень вносят не позднее 12 часов.",src:[["https://www.pnp.ru/social/volodin-rasskazal-kakie-zakony-vstupyat-v-silu-v-sentyabre.html","pnp.ru"],["https://base.garant.ru/413378848/","garant.ru"]]},{d:"01.09.2026",law:"Федеральные законы от 09.04.2026 № 92-ФЗ и от 26.06.2026 № 210-ФЗ",t:"Верификация страниц НКО и учет платежных карт",sut:"Страницы НКО в соцсетях можно подтвердить через Госуслуги; заработает единая система учета платежных карт против дропперства.",who:"НКО, банки, держатели карт.",was:"У НКО не было официального способа подтвердить, что страница в соцсети принадлежит именно ей. Единой системы учета платежных карт не было.",now:"НКО может добровольно подтвердить свои страницы через Госуслуги (ЕСИА). Создана единая система учета платежных карт: номера, виды карт, ИНН клиентов и число карт на одного человека.",src:[["https://www.pnp.ru/social/volodin-rasskazal-kakie-zakony-vstupyat-v-silu-v-sentyabre.html","pnp.ru"],["http://kremlin.ru/acts/bank/53384","kremlin.ru"]]},{d:"01.10.2026",law:"Федеральный закон от 31.07.2025 № 289-ФЗ",t:"Закон о платформенной экономике",sut:"Впервые комплексно регулируются маркетплейсы: договоры с продавцами и ПВЗ, карточки товаров, скидки, рассмотрение жалоб.",who:"Маркетплейсы, продавцы, владельцы ПВЗ, покупатели.",was:"Отдельного закона о маркетплейсах не было. Отношения платформ с продавцами и покупателями регулировались общими нормами и правилами самих платформ.",now:"Закон № 289-ФЗ впервые устанавливает обязательные правила работы цифровых платформ с продавцами, пунктами выдачи и покупателями.",src:[["https://www.v2b.ru/articles/novye-zakony-s-1-oktyabrya-2026-goda/","v2b.ru"],["https://www.pnp.ru/social/volodin-rasskazal-o-zakonakh-vstupayushhikh-v-silu-v-oktyabre-3.html","pnp.ru"]]},{d:"01.10.2026",law:"Федеральный закон от 31.07.2025 № 290-ФЗ",t:"Претензии к товару — прямо на маркетплейсе",sut:"Покупатель может предъявить требования о недостатках товара продавцу прямо на платформе; оператор обязан обеспечить возврат денег и товара.",who:"Покупатели маркетплейсов, продавцы, операторы платформ.",was:"Прежняя редакция в источниках не найдена.",now:"Закон о защите прав потребителей дополнен правилами о претензиях покупателей при покупке через цифровую платформу.",src:[["https://www.v2b.ru/articles/novye-zakony-s-1-oktyabrya-2026-goda/","v2b.ru"]]},{d:"01.10.2026",law:"Федеральный закон от 04.08.2026 № 295-ФЗ",t:"Штрафы для операторов платформ",sut:"В КоАП появилась ст. 14.69: например, за снижение цены за счет продавца без правил — штраф до 300 тыс. рублей для юрлиц.",who:"Операторы маркетплейсов.",was:"Специальной статьи КоАП о нарушениях операторов цифровых платформ не было.",now:"Введена новая ст. 14.69 КоАП — ответственность за нарушения в сфере цифровых платформ.",src:[["https://www.v2b.ru/articles/novye-zakony-s-1-oktyabrya-2026-goda/","v2b.ru"]]},{d:"01.10.2026",law:"Федеральный закон от 04.07.2026 № 218-ФЗ",t:"НДС 10% на детские товары — только с документами",sut:"Льготная ставка НДС на детские товары применяется только при наличии сертификата или декларации о соответствии.",who:"Производители, импортеры и продавцы детских товаров.",was:"НК не называл обязательных документов для подтверждения ставки 10% на детские товары.",now:"Ставку 10% можно применить, только если сведения о сертификате или декларации о соответствии есть в реестре Росаккредитации или у продавца есть документы оценки соответствия по праву ЕАЭС. ФНС получает их по запросу, при ввозе — вместе с таможенной декларацией.",src:[["https://www.v2b.ru/articles/novye-zakony-s-1-oktyabrya-2026-goda/","v2b.ru"],["https://www.pnp.ru/social/volodin-rasskazal-o-zakonakh-vstupayushhikh-v-silu-v-oktyabre-3.html","pnp.ru"]]},{d:"01.10.2026",law:"Федеральный закон от 04.08.2026 № 293-ФЗ",t:"НДС при смене налоговых правил по ходу договора",sut:"Если в ходе договора появилась обязанность платить НДС, а цена не изменена, налог считается расчетным путем от цены договора.",who:"Организации и ИП, работающие по долгосрочным договорам.",was:"НК не говорил, как считать НДС, если обязанность платить налог появилась у продавца уже после заключения договора, а цену не пересмотрели.",now:"Новый п. 3.2 ст. 166 НК: в такой ситуации налог выделяется из цены договора расчетным путем — 22/122, 10/110, 7/107 или 5/105; счет-фактура не выставляется. Правило действует, если покупатель не вправе принять НДС к вычету и договор не решает вопрос сам.",src:[["https://www.v2b.ru/articles/novye-zakony-s-1-oktyabrya-2026-goda/","v2b.ru"]]},{d:"01.10.2026",law:"Федеральный закон от 26.07.2026 № 241-ФЗ (отдельные положения)",t:"Контроль доходов трудовых мигрантов",sut:"Налоговая будет сообщать в МВД, сколько заработали трудовые мигранты, а МВД — проверять, есть ли у них доход и какого уровня.",who:"Трудовые мигранты и их работодатели.",was:"Обязанности налоговой автоматически передавать в МВД данные о доходах иностранцев закон не устанавливал.",now:"ФНС через систему межведомственного взаимодействия передает МВД данные о выплатах иностранцам из расчетов по страховым взносам (за 3, 6, 9 и 12 месяцев, не позднее 45 дней после периода) и о доходах самозанятых-иностранцев из «Мой налог» за год. МВД проверяет наличие и уровень дохода (приказ от 15.09.2026 № 728).",src:[["https://actrf.ru/izmeneniya/2026-10","actrf.ru"],["https://www.pnp.ru/social/volodin-rasskazal-o-zakonakh-vstupayushhikh-v-silu-v-oktyabre-3.html","pnp.ru"],["https://www.consultant.ru/document/cons_doc_LAW_544153/5fcf9e8df817a6bcfe340a2dc15580193cd4c683/","consultant.ru"],["https://base.garant.ru/414652930/","garant.ru"]]},{d:"01.10.2026",law:"Федеральный закон от 29.12.2025 № 545-ФЗ (ч. 5 ст. 4)",t:"Ограничение третьего «дорогого» микрозайма",sut:"МФО не могут выдать третий заем с полной стоимостью более 200% годовых, если у заемщика уже два таких займа; действует до 1 апреля 2027 года.",who:"Заемщики и микрофинансовые организации.",was:"Ограничения по числу «дорогих» займов у одного заемщика не было: МФО могла выдать новый заем с ПСК выше 200% годовых, сколько бы таких займов у человека ни было.",now:"Если у заемщика уже есть 2 непогашенных займа или кредита с ПСК выше 200% годовых (в любых МФО и банках), МФО не может выдать третий такой. Временная мера — до 1 апреля 2027 года.",src:[["https://www.pnp.ru/social/volodin-rasskazal-o-zakonakh-vstupayushhikh-v-silu-v-oktyabre-3.html","pnp.ru"],["https://www.cbr.ru/press/event/?id=32884","cbr.ru"],["https://base.garant.ru/413376720/","garant.ru"]]},{d:"01.10.2026",law:"Федеральный закон от 04.08.2026 № 278-ФЗ",t:"Закупки школ и детсадов через маркетплейсы",sut:"Стартует эксперимент: школы, детсады и другие организации могут делать закупки малого объема через маркетплейсы; до 30.09.2028.",who:"Бюджетные учреждения и поставщики.",was:"Покупать на маркетплейсах по закону № 44-ФЗ школы и детсады не могли.",now:"С 1 октября 2026 по 30 сентября 2028 года государственные и муниципальные детсады, школы и колледжи могут делать малые электронные закупки «с полки» (ч. 12 ст. 93 закона № 44-ФЗ) на маркетплейсах из специального реестра.",src:[["https://www.pnp.ru/social/volodin-rasskazal-o-zakonakh-vstupayushhikh-v-silu-v-oktyabre-3.html","pnp.ru"],["https://www.consultant.ru/document/cons_doc_LAW_518862/562c4fbde95b1c80840452fc81ebf75cf7efc6ce/","consultant.ru"],["https://www.garant.ru/news/2263346/","garant.ru"]]},{d:"24.10.2026",law:"Федеральный закон от 26.07.2026 № 263-ФЗ",t:"Изменения в закон о госрегистрации недвижимости",sut:"С публичной кадастровой карты можно убрать сведения о зданиях и сооружениях важных, режимных, критически важных и опасных объектов — например, энергетики и транспорта.",who:"Собственники недвижимости, Росреестр.",was:"Закон о госрегистрации недвижимости не позволял прекратить показ на публичной кадастровой карте сведений об отдельных объектах: все внесенные в ЕГРН объекты отображались одинаково.",now:"По заявлению федеральных органов, Росатома, Ростеха, Роскосмоса или правообладателя (через оценочную комиссию) сведения о зданиях, сооружениях и недострое таких объектов перестают отображаться. Границы участков и зоны с ограничениями не скрываются.",src:[["https://actrf.ru/izmeneniya/2026-10","actrf.ru"],["http://kremlin.ru/acts/bank/53485","kremlin.ru"],["https://www.consultant.ru/law/hotdocs/94984.html","consultant.ru"]]},{d:"24.10.2026",law:"Федеральный закон от 26.07.2026 № 256-ФЗ",t:"Изменения в закон о присяжных заседателях",sut:"Списки кандидатов в присяжные можно публиковать на сайтах и подписывать электронной подписью, а гражданин может электронно попросить исключить его из списка или исправить ошибку.",who:"Граждане, включаемые в списки присяжных, суды.",was:"Списки кандидатов в присяжные публиковались и подписывались только на бумаге, заявления граждан об ошибках в списке подавались на бумаге.",now:"Списки можно размещать на официальном сайте муниципалитета или региона и подписывать усиленной квалифицированной электронной подписью. Заявления граждан принимаются в электронной форме, а ведомства обмениваются данными через СМЭВ.",src:[["https://actrf.ru/izmeneniya/2026-10","actrf.ru"],["https://ppt.ru/obzory/vstupaet-v-silu/federalnyy-zakon-26-07-2026-256-fz","ppt.ru"],["http://www.kremlin.ru/acts/bank/53486","kremlin.ru"]]},{d:"01.11.2026",law:"Федеральный закон от 04.07.2026 № 231-ФЗ",t:"Висковый дистиллят — под контроль как спирт",sut:"Производство вискового дистиллята подчиняется правилам госрегулирования для этилового спирта; новым лицензиатам нужен уставный капитал от 100 млн рублей.",who:"Производители виски и алкоголя.",was:"Висковый дистиллят регулировался как обычный дистиллят: для лицензии хватало уставного капитала от 10 млн рублей.",now:"Новым соискателям лицензии нужен уставный капитал от 100 млн рублей. Для уже работающих требования к чистым активам — с 1 марта 2028 года.",src:[["https://www.v2b.ru/articles/novye-zakony-s-1-noyabrya-2026-goda/","v2b.ru"],["https://aif.ru/society/law/kakie-zakony-vstupyat-v-silu-s-1-noyabrya-2026-goda","aif.ru"],["http://kremlin.ru/acts/bank/53418","kremlin.ru"],["https://www.consultant.ru/law/hotdocs/94759.html","consultant.ru"]]},{d:"01.11.2026",law:"Федеральный закон от 04.08.2026 № 312-ФЗ",t:"Платежи государству — в ГИС ГМП за час",sut:"Сведения об уплате налогов, пошлин и штрафов должны поступать в ГИС ГМП не позднее часа после приема платежа; правительство может расширять перечень платежей.",who:"Граждане и компании, платящие налоги и штрафы; банки.",was:"Прежний срок передачи сведений об уплате в ГИС ГМП в источниках не найден.",now:"Банки, почта и другие организации, принимающие платеж, обязаны передать сведения об уплате в ГИС ГМП в режиме реального времени — не позднее 1 часа после принятия распоряжения. Правительство вправе расширять перечень таких платежей по согласованию с Банком России и Минцифры.",src:[["https://www.v2b.ru/articles/novye-zakony-s-1-noyabrya-2026-goda/","v2b.ru"],["http://www.kremlin.ru/acts/bank/53539","kremlin.ru"]]},{d:"01.11.2026",law:"Федеральный закон от 28.11.2025 № 425-ФЗ (отдельные положения)",t:"Вычет по НДПИ на газ на Ямале",sut:"Для отдельных добытчиков газа на полуострове Ямал вводится налоговый вычет по НДПИ, коэффициент снижается до 0,03.",who:"Газодобывающие компании.",was:"Специального вычета по НДПИ для газа полуострова Ямал не было. Прежнее значение коэффициента Ко для этих участков в источниках не найдено.",now:"По 31 июля 2027 года компании с лицензией на участок недр целиком на Ямале, запасами газа свыше 3,5 трлн куб. м и 100% контролем собственника Единой системы газоснабжения получают вычет 2 444 млн рублей; Ко для участников группы равен 0,03.",src:[["https://www.v2b.ru/articles/novye-zakony-s-1-noyabrya-2026-goda/","v2b.ru"]]},{d:"03.11.2026",law:"Федеральный закон от 04.08.2026 № 294-ФЗ",t:"Выше штрафы для иностранцев за миграционные нарушения",sut:"За нарушение правил въезда или пребывания штраф составит 4–7 тыс. рублей с возможным выдворением, при повторе — 7–9 тыс. с обязательным выдворением.",who:"Иностранные граждане и лица без гражданства.",was:"По ст. 18.8 КоАП за нарушение правил въезда или пребывания — штраф 2–5 тыс. рублей (в Москве, Петербурге и их областях — 5–7 тыс.); повторно — 5–7 тыс. (в этих регионах — 7–10 тыс.).",now:"Штраф 4–7 тыс. рублей (в Москве, Петербурге и их областях — 7–9 тыс.); повторно — 7–9 тыс. (в этих регионах — 9–12 тыс.). Расширен перечень нарушений, где выдворение нельзя заменить штрафом.",src:[["https://www.v2b.ru/articles/novye-zakony-s-1-noyabrya-2026-goda/","v2b.ru"],["https://aif.ru/society/law/kakie-zakony-vstupyat-v-silu-s-1-noyabrya-2026-goda","aif.ru"],["https://klerk.systems/docs/koap_rf/article/18.8/date20261103/","klerk.systems"]]},{d:"01.12.2026",law:"Федеральный закон от 26.06.2026 № 195-ФЗ (отдельные положения)",t:"Изменения в Бюджетный кодекс",sut:"Новый технологический сбор с электроники целиком, на 100%, зачисляется в федеральный бюджет.",who:"Органы власти, получатели бюджетных средств.",was:"Технологического сбора не существовало, и в ст. 51 Бюджетного кодекса такого дохода не было.",now:"П. 1 ст. 51 Бюджетного кодекса дополнен: технологический сбор зачисляется в федеральный бюджет по нормативу 100%.",src:[["https://actrf.ru/izmeneniya/2026-12","actrf.ru"],["http://www.kremlin.ru/acts/bank/53361","kremlin.ru"]]},{d:"01.12.2026",law:"Федеральный закон от 28.11.2025 № 425-ФЗ (отдельные положения)",t:"Налоговые поправки: очередной этап",sut:"Импортеры и производители электроники и электронных компонентов платят технологический сбор — не больше 5000 рублей за единицу; без уплаты маркируемый товар нельзя ввести в оборот.",who:"Налогоплательщики — организации и граждане.",was:"Такого сбора не было: ввоз и производство электроники не облагались отдельным платежом по закону о промышленной политике.",now:"Ст. 6 закона № 425-ФЗ вводит в закон № 488-ФЗ ст. 10.2: правительство утверждает перечень электроники и размер сбора (фиксированная сумма до 5000 рублей за единицу), платят импортеры и производители. Неуплата блокирует ввод в оборот маркируемых товаров.",src:[["https://actrf.ru/izmeneniya/2026-12","actrf.ru"],["https://klerk.systems/docs/fz_425_2025/article/6/","klerk.systems"]]},{d:"07.12.2026",law:"Федеральный закон от 10.06.2026 № 178-ФЗ",t:"Изменение условий содержания под стражей",sut:"Сотрудников аппаратов судов, взятых под стражу, будут содержать отдельно от остальных арестованных — так же, как судей.",who:"Подозреваемые, обвиняемые, СИЗО.",was:"Ст. 33 закона о содержании под стражей требовала отдельно содержать судей и ряд других категорий. Работников аппаратов судов в этом перечне не было.",now:"После слова «судьями» в перечень добавлены «работниками аппаратов судов»: их содержат отдельно от других подозреваемых и обвиняемых.",src:[["https://actrf.ru/izmeneniya/2026-12","actrf.ru"]]},{d:"15.12.2026",law:"Федеральный закон от 15.12.2025 № 459-ФЗ",t:"Упразднение Беловского районного суда",sut:"Беловский районный суд Кемеровской области упраздняется; его дела переходят Беловскому городскому суду, который будет рассматривать дела и города Белово, и Беловского района.",who:"Жители и участники дел в Кемеровской области.",was:"В Белове работали два суда: Беловский районный — для Беловского района и Беловский городской — для города.",now:"Районный суд упразднен, его подсудность передана Беловскому городскому суду.",src:[["https://actrf.ru/izmeneniya/2026-12","actrf.ru"]]},{d:"23.12.2026",law:"Федеральный закон от 26.06.2026 № 192-ФЗ (отдельные положения)",t:"Поправки в закон «Об обороне»",sut:"Для закрытых военных городков вводится особый режим — пропуска, ограничения въезда и проживания, проверка документов; военные получают право глушить, перехватывать и сбивать беспилотники у объектов Минобороны.",who:"Военнослужащие, органы военного управления.",was:"Закон «Об обороне» не содержал статей об особом режиме закрытых военных городков и прямо не давал военным права пресекать работу беспилотников у своих объектов.",now:"Новые ст. 10.3 и 10.4: в городках из перечня правительства — пропускной режим, ограничения въезда, проживания, передвижения и полетов, проверка документов. Военные пресекают работу беспилотных аппаратов, в том числе подавляя сигнал, повреждая или уничтожая их.",src:[["https://actrf.ru/izmeneniya/2026-12","actrf.ru"],["http://www.kremlin.ru/acts/bank/53354","kremlin.ru"]]},{d:"23.12.2026",law:"Федеральный закон от 26.06.2026 № 215-ФЗ (отдельные положения)",t:"Изменения в отдельные законодательные акты",sut:"Банки будут выдавать Минюсту справки по счетам иноагентов только в электронном виде и за 3 рабочих дня.",who:"Определяется текстом закона.",was:"Ч. 12 ст. 26 закона о банках предусматривала выдачу справок по запросам без требования к электронной форме. Срок ответа на запрос о финансах иноагента закон № 255-ФЗ не устанавливал.",now:"Справки выдаются в электронной форме по электронному запросу. Сведения о финансово-хозяйственной деятельности иноагентов предоставляются в течение 3 рабочих дней, справки банков при признаках нарушений — тоже за 3 рабочих дня.",src:[["https://actrf.ru/izmeneniya/2026-12","actrf.ru"],["http://kremlin.ru/acts/bank/53391","kremlin.ru"]]},{d:"31.12.2026",law:"Федеральный закон от 04.07.2026 № 225-ФЗ",t:"Пенсии силовиков: изменение ст. 50",sut:"Пенсионерам Минобороны, МВД, ФСИН, ФССП, ФСБ, прокуратуры и СК, получающим пенсию по закону № 4468-I, будут выдавать пенсионное удостоверение; его образец и порядок выдачи утвердит ведомство, которое платит пенсию.",who:"Военные и силовые пенсионеры и их семьи.",was:"Ст. 50 закона № 4468-I состояла из одной части: работу по пенсионному обеспечению ведут Минобороны, МВД, ФСИН, ФССП, ФСБ, Генпрокуратура и СК. О пенсионных удостоверениях в статье ничего не говорилось.",now:"Добавлена часть вторая: всем, кому назначена пенсия по этому закону, выдаются пенсионные удостоверения. Образец, порядок оформления, учета и выдачи утверждает ведомство, организующее пенсионное обеспечение.",src:[["https://actrf.ru/izmeneniya/2026-12","actrf.ru"],["http://kremlin.ru/acts/bank/53427","kremlin.ru"]]},{d:"31.12.2026",law:"Федеральный закон от 04.07.2026 № 224-ФЗ",t:"Поправки в закон о Следственном комитете",sut:"Семьи сотрудников Следственного комитета, погибших в связи с СВО, получат жилищную выплату не позднее года со дня гибели; за ними и за рядом сотрудников сохраняется право жить в служебном жилье.",who:"Сотрудники СК России.",was:"Ст. 35.1 закона о СК не устанавливала срок выплаты семьям сотрудников, погибших после мобилизации или по контракту в зоне СВО. Ч. 20 ссылалась только на ч. 21.",now:"Новая ч. 21.1: единовременная выплата на жилье членам семьи — не позднее 1 года со дня гибели. Ч. 28 расширена: за этими семьями сохраняется служебное жилье до выплаты. Ч. 28.1 сохраняет жилищные права сотрудников, служащих в отдельных регионах. Действует с 24 февраля 2022 года.",src:[["https://actrf.ru/izmeneniya/2026-12","actrf.ru"],["http://www.kremlin.ru/acts/bank/53410","kremlin.ru"]]},{d:"31.12.2026",law:"Федеральный закон от 04.07.2026 № 236-ФЗ (отдельные положения)",t:"Поправки в закон «Об оружии»",sut:"Охотникам разрешат охотничью пневматику мощнее 25 Дж — до 5 единиц; контрольный отстрел нарезного оружия обязателен только для изготовленного в России или купленного за границей.",who:"Владельцы оружия, продавцы, Росгвардия.",was:"Охотничье пневматическое оружие было ограничено дульной энергией не более 25 Дж. Контрольный отстрел требовался и в случаях, перечисленных в п. 2–6 и 9 ч. 2 ст. 13.1.",now:"Ограничение 25 Дж снято; охотник может иметь до 5 единиц пневматики свыше 25 Дж. Контрольный отстрел остается для оружия, изготовленного в России или купленного за рубежом; п. 2–6 и 9 ч. 2 ст. 13.1 утратили силу.",src:[["https://actrf.ru/izmeneniya/2026-12","actrf.ru"],["http://kremlin.ru/acts/bank/53407","kremlin.ru"]]},{d:"31.12.2026",law:"Федеральный закон от 13.02.2025 № 9-ФЗ",t:"Займы — в бюро кредитных историй сразу",sut:"Банки и МФО обязаны незамедлительно передавать в БКИ сведения о договорах потребительского кредита для борьбы с мошенничеством.",who:"Заемщики, банки, МФО.",was:"Отдельной обязанности передавать в БКИ сведения о заявке, одобрении, выдаче или отказе в течение 30 минут не было; прежний общий срок передачи в источниках не найден.",now:"Банки и МФО передают эти сведения незамедлительно, не позднее 30 минут, вместе с ИНН и датой рождения клиента; перед выдачей денег запрашивают данные во всех квалифицированных БКИ и хранят их 5 лет.",src:[["https://www.consultant.ru/law/hotdocs/95641.html","consultant.ru"],["https://www.consultant.ru/document/cons_doc_LAW_544153/66753f72fae50dc04be9e33a941f3c4ac3f57176/","consultant.ru"]]}],CAL:{w:[["30.09.2026","04.10.2026","plenary"],["05.10.2026","11.10.2026","regional"],["12.10.2026","01.11.2026","plenary"],["02.11.2026","08.11.2026","regional"],["09.11.2026","29.11.2026","plenary"],["30.11.2026","06.12.2026","regional"]],p:[["30.09.2026","held"],["01.10.2026","held"],["13.10.2026","held"],["14.10.2026","held"],["15.10.2026","held"],["20.10.2026","held"],["21.10.2026","held"],["22.10.2026","held"],["27.10.2026","confirmed"],["28.10.2026","confirmed"],["29.10.2026","confirmed"],["10.11.2026","confirmed"],["11.11.2026","confirmed"],["12.11.2026","expected"],["17.11.2026","expected"],["18.11.2026","expected"],["19.11.2026","expected"],["24.11.2
